<title>元素ラボ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* レイアウト: 周期表のマス目をモチーフにした1カラムのアプリ。上部タブで 学ぶ / クイズ / 成長 を切替 */
:root {
  --bg: #eef1f6; --surface: #ffffff; --fg: #17203a; --muted: #5d6785; --line: #d6dbe7;
  --accent: #3047d6; --accent-soft: rgba(48, 71, 214, .16); --on-accent: #ffffff;
  --ok: #138a52; --ok-bg: #e2f5ea; --ng: #c23a3a; --ng-bg: #fbe8e8;
  --c-alkali: #e5484d; --c-alkaline: #f08a24; --c-transition: #3e7be0; --c-post: #7b8aa8;
  --c-metalloid: #12a594; --c-nonmetal: #46a758; --c-halogen: #c2a000; --c-noble: #8e4ec6; --c-actinide: #d6409f;
  --lv-new: #e3e7ef; --lv-weak: #f6c4c4; --lv-learning: #f8e19a; --lv-master: #9ed9b3;
  --f-display: "Dela Gothic One", "Hiragino Sans", sans-serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1424; --surface: #181f35; --fg: #e8ecf7; --muted: #98a2c0; --line: #2a3352;
  --accent: #7d8ffb; --accent-soft: rgba(125, 143, 251, .22); --on-accent: #0f1424;
  --ok: #5fd39a; --ok-bg: #12301f; --ng: #ff8a8a; --ng-bg: #3a1a1e;
  --lv-new: #232b45; --lv-weak: #6b2e34; --lv-learning: #6b5a1c; --lv-master: #1f5c3a;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1424; --surface: #181f35; --fg: #e8ecf7; --muted: #98a2c0; --line: #2a3352;
  --accent: #7d8ffb; --accent-soft: rgba(125, 143, 251, .22); --on-accent: #0f1424;
  --ok: #5fd39a; --ok-bg: #12301f; --ng: #ff8a8a; --ng-bg: #3a1a1e;
  --lv-new: #232b45; --lv-weak: #6b2e34; --lv-learning: #6b5a1c; --lv-master: #1f5c3a;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 10px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.brand h1 { font-family: var(--f-display); font-weight: 400; font-size: 26px; margin: 0; letter-spacing: .02em; }
.brand span { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 4px; }
.tab { border: 0; background: transparent; padding: 8px 4px; border-radius: 7px; font-weight: 700; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }

h2 { font-family: var(--f-display); font-weight: 400; font-size: 20px; margin: 22px 0 10px; text-wrap: balance; }
h4 { font-size: 12px; letter-spacing: .08em; color: var(--muted); margin: 16px 0 4px; }
.lead { color: var(--muted); margin: 0 0 14px; }

/* 元素タイル */
.tile { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; aspect-ratio: 1; max-width: 100%;
  background: var(--surface); border: 1px solid var(--line); border-top: 5px solid var(--cat); border-radius: 6px; padding: 4px 2px; min-width: 0; }
.t-num { position: absolute; top: 3px; left: 5px; font-family: var(--f-mono); font-size: 10px; color: var(--muted); }
.t-sym { font-family: var(--f-mono); font-weight: 600; font-size: 22px; line-height: 1.1; }
.t-name { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.grid, .mini-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; }
.grid .tile::after { content: ""; position: absolute; right: 5px; top: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--lv-new); }
.grid .tile.lv-master::after { background: var(--ok); }
.grid .tile.lv-weak::after { background: var(--ng); }
.grid .tile.lv-learning::after { background: var(--c-halogen); }

.groups { display: grid; gap: 8px; }
.group { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; grid-template-columns: auto 1fr; column-gap: 12px; }
.g-range { font-family: var(--f-mono); font-size: 12px; color: var(--accent); grid-row: span 2; padding-top: 3px; }
.g-goro { font-weight: 700; font-size: 16px; }
.g-sym { font-family: var(--f-mono); font-size: 12px; color: var(--muted); word-spacing: 3px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.chip[style] { border-left: 6px solid var(--cat); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

/* 詳細シート */
.sheet { position: fixed; inset: 0; background: rgba(10, 14, 30, .5); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet-in { background: var(--surface); width: 100%; max-width: 560px; max-height: 85vh; overflow: auto; border-radius: 16px 16px 0 0;
  padding: 18px max(18px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); }
.sheet-top { display: flex; justify-content: flex-end; }
.x { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 2px 10px; }
.d-head { display: flex; gap: 14px; align-items: center; }
.d-tile { position: relative; width: 78px; height: 78px; border: 1px solid var(--line); border-top: 7px solid var(--cat); border-radius: 8px; display: grid; place-items: center; flex: none; }
.d-sym { font-family: var(--f-mono); font-weight: 600; font-size: 34px; }
.d-name { font-family: var(--f-display); font-size: 24px; }
.d-en { color: var(--muted); font-size: 13px; }
.d-goro { font-size: 17px; font-weight: 700; margin: 0; }
.sheet ul { margin: 0; padding-left: 20px; }
.d-stat { margin-top: 16px; font-size: 13px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }

/* クイズ */
.modes { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.mode { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 2px; }
.mode:hover { border-color: var(--accent); }
.mode.mix { border-style: dashed; }
.m-label { font-weight: 700; font-size: 16px; }
.m-desc { color: var(--muted); font-size: 13px; }
.m-best { font-family: var(--f-mono); font-size: 12px; color: var(--accent); margin-top: 4px; }
.q-bar { display: flex; align-items: center; gap: 10px; font-family: var(--f-mono); font-size: 13px; margin-bottom: 14px; }
.q-prog { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.q-prog span { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.q-score { font-weight: 600; color: var(--accent); }
.q-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 26px 16px; text-align: center; margin-bottom: 14px; }
.big-sym { font-family: var(--f-mono); font-weight: 600; font-size: 64px; line-height: 1; }
.big-name { font-family: var(--f-display); font-size: 40px; line-height: 1.2; }
.q-text { font-size: 19px; font-weight: 700; display: block; max-width: 30em; margin: 0 auto; text-wrap: balance; }
.q-sub { color: var(--muted); margin-top: 8px; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opt { background: var(--surface); border: 2px solid var(--line); border-radius: 10px; padding: 14px 8px; font-weight: 700; font-size: 16px; min-height: 58px; }
.opt.mono { font-family: var(--f-mono); font-size: 22px; }
.opt.right { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); }
.opt.miss { border-color: var(--ng); background: var(--ng-bg); color: var(--ng); }
.opt:disabled { cursor: default; }
.type-form { display: flex; gap: 8px; }
.type-form input { flex: 1; min-width: 0; font-family: var(--f-mono); font-size: 26px; text-align: center; padding: 10px; border: 2px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 18px; font-weight: 700; }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.feedback { margin-top: 14px; border-radius: 12px; padding: 14px; display: grid; gap: 8px; }
.feedback.ok { background: var(--ok-bg); }
.feedback.ng { background: var(--ng-bg); }
.fb-head { font-weight: 700; font-size: 17px; }
.feedback.ok .fb-head { color: var(--ok); } .feedback.ng .fb-head { color: var(--ng); }
.fb-body { font-size: 14px; }
.feedback .btn { justify-self: end; }
.streak { text-align: center; font-family: var(--f-mono); color: var(--accent); font-size: 13px; }
.result { text-align: center; }
.r-score { font-family: var(--f-display); font-size: 72px; line-height: 1; color: var(--accent); }
.r-score small { font-size: 22px; margin-left: 4px; }
.r-sub { margin: 6px 0 10px; }
.badge { display: inline-block; margin-left: 8px; background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 1px 10px; font-size: 12px; font-weight: 700; }
.result .mini-grid { max-width: 420px; margin: 0 auto; }
.perfect { font-weight: 700; }
.r-actions { display: flex; gap: 8px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }

/* 成長 */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; }
.s-val { font-family: var(--f-mono); font-weight: 600; font-size: 24px; font-variant-numeric: tabular-nums; }
.s-val small { font-size: 13px; color: var(--muted); }
.s-lab { font-size: 12px; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
#chart { width: 100%; height: 200px; display: block; }
.chart-key { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 6px; flex-wrap: wrap; }
.chart-key i { display: inline-block; width: 14px; height: 4px; vertical-align: middle; margin-right: 4px; border-radius: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; margin-bottom: 10px; }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.sw.lv-new, .tile.heat.lv-new { background: var(--lv-new); }
.sw.lv-weak, .tile.heat.lv-weak { background: var(--lv-weak); }
.sw.lv-learning, .tile.heat.lv-learning { background: var(--lv-learning); }
.sw.lv-master, .tile.heat.lv-master { background: var(--lv-master); }
#mastery-grid { grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 4px; }
.tile.heat .t-sym { font-size: 17px; } .tile.heat .t-name { display: none; }
.history { list-style: none; padding: 0; margin: 0; }
.history li { display: grid; grid-template-columns: 1fr 1.3fr auto auto; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.history .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; }
.history .empty { display: block; color: var(--muted); }
.reset { margin-top: 24px; font-size: 13px; color: var(--muted); }
.reset .btn { font-size: 13px; padding: 6px 12px; }
.confirm { margin-top: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

@media (max-width: 520px) {
  .stats { grid-template-columns: 1fr 1fr; }
  .big-sym { font-size: 54px; } .big-name { font-size: 32px; }
  .modes { grid-template-columns: 1fr 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <div class="brand"><h1>元素ラボ</h1><span><b id="el-count">0</b> elements</span></div>
    <nav class="tabs" role="tablist">
      <button class="tab" data-tab="learn" role="tab">学ぶ</button>
      <button class="tab" data-tab="quiz" role="tab">クイズ</button>
      <button class="tab" data-tab="growth" role="tab">成長</button>
    </nav>
  </header>

  <section class="view" id="view-learn">
    <h2>並びで覚えるゴロ</h2>
    <div class="groups" id="groups"></div>
    <h2>元素カード</h2>
    <p class="lead">タップすると覚え方と身近な使い道が出ます。右上の点はクイズでの習得度です。</p>
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="view" id="view-quiz" hidden>
    <h2>クイズ</h2>
    <div id="quiz-area"></div>
  </section>

  <section class="view" id="view-growth" hidden>
    <h2>成長の記録</h2>
    <div class="stats" id="stats"></div>
    <h2>正答率の推移</h2>
    <div class="panel">
      <canvas id="chart" aria-label="正答率と得点の推移グラフ"></canvas>
      <div class="chart-key"><span><i style="background:var(--accent)"></i>正答率</span><span><i style="background:var(--accent-soft);height:10px"></i>得点</span><span id="chart-note"></span></div>
    </div>
    <h2>習得マップ</h2>
    <div class="legend" id="legend"></div>
    <div class="grid" id="mastery-grid"></div>
    <h2>最近のプレイ</h2>
    <ul class="history" id="history"></ul>
    <div class="reset">記録はこの端末のブラウザに保存されます。
      <button class="btn" id="reset-ask">記録をリセット</button>
      <div class="confirm" id="reset-confirm" hidden>すべての記録を消します。よろしいですか？
        <button class="btn primary" id="reset-yes">消す</button><button class="btn" id="reset-no">やめる</button></div>
    </div>
  </section>
</div>

<div class="sheet" id="detail" hidden>
  <div class="sheet-in" role="dialog" aria-modal="true">
    <div class="sheet-top"><button class="x" id="detail-close">閉じる</button></div>
    <div id="detail-body"></div>
  </div>
</div>

<script src="elements.js"></script>
<script src="app.js"></script>
